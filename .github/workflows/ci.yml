name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, lax]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      # The direct dependencies are exactly go-sdk, bcommon and borg, go.mod
      # is tidy, nothing is replaced, and go-sdk resolves to exactly v1.7.1.
      - name: dependency set
        run: make deps-check
      # LICENSE-THIRD-PARTY is generated from what the binaries link; a
      # dependency added without it fails here.
      - name: licences
        run: make licences
      # Includes the Go side of the cross-language check: the tests decode,
      # open, fold, admit and rebuild what the TypeScript codec wrote under
      # testdata/ts. The command's tests run it in process against stand-in
      # hosts and a local chain; nothing leaves the runner.
      - name: test
        run: make go-test
      # Regenerates the Go vectors and compares them byte for byte, so a
      # stale vector or one nothing generates fails here.
      - name: vectors match the Go codec
        run: GOWORK=off go run ./cmd/vectors -check

  # The TypeScript package under host/ runs every Go-generated vector and
  # writes the vectors the Go job reads, so a change that moves the bytes on
  # one side and not the other fails in one job or the other. Its tests also
  # build the host module's bundle and run it: every transaction vector
  # through the topic manager and through the overlay engine, every lookup
  # class, the index rules, restore, and the terms route with a paying
  # client.
  ts:
    runs-on: [self-hosted, lax]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The runtime major the overlay host runs, which package.json also
          # pins.
          node-version: "24"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run check
      - name: test
        run: npm test
      - name: vectors match the TypeScript codec
        run: npm run vectors-check

  # QUICKSTART.md, run as written (scripts/quickstart-check.sh): what a
  # newcomer runs. It needs borg's command and host images at the tag go.mod
  # pins, built from borg's repository at that tag.
  quickstart:
    runs-on: [self-hosted, lax]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - name: borg's images, at the tag go.mod pins
        run: |
          v=$(sed -n 's#^\s*github.com/lightwebinc/borg \(v[^ ]*\).*#\1#p' go.mod)
          git clone --quiet --depth 1 --branch "$v" https://github.com/lightwebinc/borg "$RUNNER_TEMP/borg"
          cd "$RUNNER_TEMP/borg"
          make docker-build VERSION="$v"
          make docker-build-host VERSION="$v" REFERENCE_HOST_IMAGE=${{ vars.REFERENCE_HOST_IMAGE || 'ghcr.io/lightwebinc/overlay-blueprints:0.2.2' }}
      - name: images
        run: |
          make docker-build
          make docker-build-host BORG_HOST_IMAGE=ghcr.io/lightwebinc/borg-host:latest
      # The self-hosted runners share one Docker daemon, and this stack
      # publishes fixed host ports. The lock serializes this repository's
      # quickstarts; holding it, any bsecret-quickstart-check-* stack left is an
      # orphan of a cancelled run (cancel skips the script's teardown), so it
      # is removed first.
      - name: the quickstart, as written
        run: |
          flock /tmp/bsecret-quickstart.lock sh -c '
            docker ps -aq --filter name=^bsecret-quickstart-check- | xargs -r docker rm -f
            docker network ls -q --filter name=^bsecret-quickstart-check- | xargs -r docker network rm
            docker volume ls -q --filter name=^bsecret-quickstart-check- | xargs -r docker volume rm
            make quickstart-check'
