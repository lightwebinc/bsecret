name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # borg is a private module this job has no credentials for. Its tagged
    # archive is in third_party/goproxy and is served as a file proxy ahead
    # of the public one; go.sum holds the tag's hashes, so the copy is
    # checked. The Makefile sets the same three for its own targets.
    env:
      GOPROXY: file://${{ github.workspace }}/third_party/goproxy,https://proxy.golang.org,direct
      GONOPROXY: none
      GONOSUMDB: github.com/lightwebinc/borg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      # The direct dependencies are exactly go-sdk, bcommon and borg, go.mod
      # is tidy, nothing is replaced, and go-sdk resolves to exactly v1.7.1.
      - name: dependency set
        run: make deps-check
      # LICENSE-THIRD-PARTY is generated from what the binaries link; a
      # dependency added without it fails here.
      - name: licences
        run: make licences
      # Includes the Go side of the cross-language check: the tests decode,
      # open, fold, admit and rebuild what the TypeScript codec wrote under
      # testdata/ts. The command's tests run it in process against stand-in
      # hosts and a local chain; nothing leaves the runner.
      - name: test
        run: make go-test
      # Regenerates the Go vectors and compares them byte for byte, so a
      # stale vector or one nothing generates fails here.
      - name: vectors match the Go codec
        run: GOWORK=off go run ./cmd/vectors -check

  # The TypeScript package under host/ runs every Go-generated vector and
  # writes the vectors the Go job reads, so a change that moves the bytes on
  # one side and not the other fails in one job or the other. Its tests also
  # build the host module's bundle and run it: every transaction vector
  # through the topic manager and through the overlay engine, every lookup
  # class, the index rules, restore, and the terms route with a paying
  # client.
  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          # The runtime major the overlay host runs, which package.json also
          # pins.
          node-version: "24"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run check
      - name: test
        run: npm test
      - name: vectors match the TypeScript codec
        run: npm run vectors-check
