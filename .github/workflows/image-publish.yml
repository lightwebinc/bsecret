name: image-publish

# Manual, gated image publish of ghcr.io/lightwebinc/bsecret (the command). No
# automated trigger. bsecret-devchain and bsecret-host are built locally
# (make docker-build, make docker-build-host).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish image to ghcr.io'
        required: true
      tag:
        description: 'Image tag, a released version without the v (e.g. 0.3.1)'
        required: true
      dry-run:
        description: 'Build only, push nothing'
        type: boolean
        default: false

jobs:
  publish:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/image-publish.yml@7f9020d8d83ebd09b9a9581aa0ee6cc2f78708e0 # v0.5.1
    with:
      runs-on: 'ubuntu-latest'
      tag: ${{ inputs.tag }}
      environment: ""
      dry-run: ${{ inputs.dry-run }}
