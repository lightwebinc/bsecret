name: Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: read

jobs:
  # bsecret is a command somebody installs, so a release that carries no
  # binary is a release nobody can use. Four platforms, each a static
  # binary in a tarball beside the licenses.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The host package's version is the tag's.
      - name: the host package's version is the tag's
        run: |
          v=$(node -p "require('./host/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "host/package.json is $v, the tag is $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Dockerfile builder's toolchain; it may lead go.mod's go line.
          go-version: "1.27.3"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          dir="bsecret_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${dir}"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/${dir}/bsecret" ./cmd/bsecret
          # The licenses travel inside the tarball. A statically linked
          # binary contains its dependencies' code, and their licenses
          # require their text to reach whoever receives a binary.
          cp LICENSE NOTICE LICENSE-THIRD-PARTY README.md "dist/${dir}/"
          tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"
          ( cd dist && sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256" )

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bsecret_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -eux
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.tar.gz.sha256
          ls -l
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
