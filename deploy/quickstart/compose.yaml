# The quickstart: all of bsecret on one machine, in minutes, with no coin.
# A local chain stands in for the network; two overlay hosts run the borg
# module and the bsecret module over one MySQL, host-a with a terms route
# that prices the audit and history questions; and the borg and bsecret
# commands run beside them, in unicast mode, so every object goes to both
# hosts. QUICKSTART.md walks through it.
#
# The chain (bsecret-devchain) has no proof of work and no peers, and
# nothing it mines is money: it is for trying bsecret, never for a network.
# Every password here is a throwaway meant to be seen.
#
# Optional: BSECRET_IMAGE, BSECRET_HOST_IMAGE, DEVCHAIN_IMAGE and BORG_IMAGE
# name the images (default: the published ones, tag latest).

name: bsecret-quickstart

x-host: &host
  image: ${BSECRET_HOST_IMAGE:-ghcr.io/lightwebinc/bsecret-host:latest}
  depends_on:
    db:
      condition: service_healthy
    chain:
      condition: service_started
  restart: unless-stopped

services:
  chain:
    image: ${DEVCHAIN_IMAGE:-ghcr.io/lightwebinc/bsecret-devchain:latest}
    volumes:
      - chain:/var/lib/devchain
    restart: unless-stopped

  db:
    image: mysql:9@sha256:30a0abfa7b502a496e12339b54cd07aaa70363396dc4b8e8a72a92804a505cd6
    environment:
      MYSQL_DATABASE: overlay_a
      MYSQL_USER: overlay
      MYSQL_PASSWORD: quickstart
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    configs:
      - source: second-database
        target: /docker-entrypoint-initdb.d/second-database.sql
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uoverlay -pquickstart --silent"]
      interval: 3s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # host-a sells the audit and history questions on its terms route (port
  # 8090), paid to BSECRET_PAYEE_KEY. Both hosts carry the crypt and the
  # hall the vault's group lives in.
  host-a:
    <<: *host
    environment:
      BSECRET_CRYPTS: ${BSECRET_CRYPTS:-}
      BORG_HALLS: ${BORG_HALLS:-}
      BSECRET_LISTEN: 0.0.0.0:8090
      BSECRET_PRICES: history=5,history-after=5,audit=20,audit-after=20
      BSECRET_PAYEE_KEY: ${BSECRET_PAYEE_KEY:-}
      OVERLAY_KNEX_URL: mysql://overlay:quickstart@db:3306/overlay_a
      OVERLAY_CHAIN_TRACKER_URL: http://chain:8080
    volumes:
      - state-a:/var/lib/bsecret
      - borg-state-a:/var/lib/borg
    ports:
      - "127.0.0.1:8381:8080"
      - "127.0.0.1:8391:8090"

  host-b:
    <<: *host
    environment:
      BSECRET_CRYPTS: ${BSECRET_CRYPTS:-}
      BORG_HALLS: ${BORG_HALLS:-}
      OVERLAY_KNEX_URL: mysql://overlay:quickstart@db:3306/overlay_b
      OVERLAY_CHAIN_TRACKER_URL: http://chain:8080
    volumes:
      - state-b:/var/lib/bsecret
      - borg-state-b:/var/lib/borg
    ports:
      - "127.0.0.1:8382:8080"

  # The borg command, run with `docker compose run --rm -T borg <command>`:
  # the organisation, its members and its group are borg's. Its homes are
  # in the named volume `borg-home`, one directory each, named by BORG_HOME.
  borg:
    image: ${BORG_IMAGE:-ghcr.io/lightwebinc/borg:latest}
    profiles: [cli]
    environment:
      BORG_NETWORK: regtest
      BORG_MODE: unicast
      BORG_HOSTS: http://host-a:8080,http://host-b:8080
      BORG_HALL: ${BORG_HALLS:-}
      BORG_ORG: ${BSECRET_ORG:-}
      BORG_DELAY: 0s
      BORG_HEADER_URL: http://chain:8080
      BORG_CHAIN: asset:http://chain:8080
      BORG_RPC: http://chain:8080/rpc
      BORG_SETTLE: rpc:http://chain:8080/rpc
    volumes:
      - borg-home:/home/nonroot/.borg

  # The bsecret command, run with `docker compose run --rm -T bsecret
  # <command>`. Its homes (identities, coin pools, state) are in the named
  # volume `home`, one directory each, named by BSECRET_HOME. It reads the
  # borg homes, to make each of its own around a borg home's identity
  # (init -borg), and host-a's state directory, for the payee's settle.
  bsecret:
    image: ${BSECRET_IMAGE:-ghcr.io/lightwebinc/bsecret:latest}
    profiles: [cli]
    environment:
      BSECRET_NETWORK: regtest
      BSECRET_MODE: unicast
      BSECRET_HOSTS: http://host-a:8080,http://host-b:8080
      BSECRET_PAID_HOST: http://host-a:8090
      BSECRET_CRYPT: ${BSECRET_CRYPTS:-}
      BSECRET_HALL: ${BORG_HALLS:-}
      BSECRET_ORG: ${BSECRET_ORG:-}
      BSECRET_CONTENT: /var/lib/bsecret-content
      # The hosts read the same local chain's headers as the command, so a
      # mined token needs no propagation delay here; on a network leave the
      # default of 60s.
      BSECRET_DELAY: 0s
      BSECRET_HEADER_URL: http://chain:8080
      BSECRET_CHAIN: asset:http://chain:8080
      BSECRET_RPC: http://chain:8080/rpc
      BSECRET_SETTLE: rpc:http://chain:8080/rpc
    volumes:
      - home:/home/nonroot/.bsecret
      - borg-home:/home/nonroot/.borg:ro
      - content:/var/lib/bsecret-content
      - state-a:/var/lib/bsecret-a:ro

configs:
  second-database:
    content: |
      CREATE DATABASE IF NOT EXISTS overlay_b;
      GRANT ALL PRIVILEGES ON overlay_b.* TO 'overlay'@'%';

volumes:
  borg-home:
  borg-state-a:
  borg-state-b:
  chain:
  content:
  db:
  home:
  state-a:
  state-b:
